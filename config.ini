; Autosave settings. The in-game "Autosave" options page changes the same values and
; writes them here when the game saves its options. Exit the game before editing.

[autosave]
; Save the retry state when the game updates its retry checkpoint. 1 = on, 0 = off.
enabled=1
; Shortest time between two autosaves, in minutes: 0, 1, 3, 5 or 10.
; Checkpoint updates sooner than this after the last autosave are skipped; 0 saves every update.
minimum_interval=0
